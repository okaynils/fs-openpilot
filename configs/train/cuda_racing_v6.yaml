# Run entirely on Modal: modal run --detach scripts/modal_app.py::racing
name: cuda_racing_v6
sim_root: data/sim/racing_v6
label_mode: racing
init_ckpt: runs/cuda_stage2_v2_refresh/ckpt/best.pt
cache_tag: racing_init
stage: 2
trunk: last
batch_size: 64
